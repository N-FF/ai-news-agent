<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日AI新闻助手</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 800px;">
  <h2 class="mb-4">📰 每日AI新闻助手 Agent</h2>

  <!-- 1. 身份 -->
  <div class="card mb-3">
    <div class="card-header">1. 填写你的身份</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-4"><input id="name" class="form-control" placeholder="你的名字"></div>
        <div class="col-md-6"><input id="email" class="form-control" placeholder="你的邮箱（接收简报）"></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" onclick="createUser()">注册/登录</button></div>
      </div>
      <div id="userInfo" class="mt-2 text-success"></div>
    </div>
  </div>

  <!-- 2. 订阅偏好 -->
  <div class="card mb-3">
    <div class="card-header">2. 设置订阅偏好</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-4"><input id="topic" class="form-control" placeholder="关注话题，如：大模型"></div>
        <div class="col-md-4"><input id="keyword" class="form-control" placeholder="额外关键词（可选）"></div>
        <div class="col-md-2"><button class="btn btn-success w-100" onclick="addSub()">添加</button></div>
      </div>
      <ul id="subList" class="mt-3 list-group"></ul>
    </div>
  </div>

  <!-- 3. 定时推送设置 -->
  <div class="card mb-3">
    <div class="card-header">3. 设置每日推送时间</div>
    <div class="card-body">
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <input id="dailySendTime" type="time" class="form-control" value="09:00">
        </div>
        <div class="col-md-4">
          <input id="timezoneName" type="text" class="form-control" placeholder="时区，例如 Asia/Shanghai">
        </div>
        <div class="col-md-2">
          <button class="btn btn-outline-primary w-100" onclick="saveSchedule()">保存推送时间</button>
        </div>
        <div class="col-md-2 text-muted small">按所选时区执行</div>
      </div>
      <div id="scheduleInfo" class="mt-2" role="status"></div>
    </div>
  </div>

  <!-- 4. 触发 & 历史 -->
  <div class="card mb-3">
    <div class="card-header">4. 生成简报</div>
    <div class="card-body">
      <button class="btn btn-warning" onclick="triggerNow()">🚀 立即生成今日简报</button>
      <button class="btn btn-outline-secondary" onclick="loadHistory()">查看历史简报</button>
      <div id="result" class="mt-3"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">历史简报</div>
    <div class="card-body">
      <div id="historyList"></div>
    </div>
  </div>
</div>

<script>
let currentUser = null;

async function api(path, method="GET", body=null) {
  const opts = {method, headers: {"Content-Type": "application/json"}};
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  return r.json();
}

async function createUser() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  if (!name || !email) return alert("请填写名字和邮箱");
  const timezone_name = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Shanghai";
  const r = await api("/api/users", "POST", {name, email, timezone_name});
  if (r.code !== 0) return alert(r.msg);
  currentUser = r.user;
  document.getElementById("userInfo").innerText = `已登录：${currentUser.name} (${currentUser.email})`;
  loadSubs();
}

async function addSub() {
  if (!currentUser) return alert("请先注册/登录");
  const topic = document.getElementById("topic").value.trim();
  const keyword = document.getElementById("keyword").value.trim();
  if (!topic) return alert("请填话题");
  await api("/api/subscriptions", "POST", {user_email: currentUser.email, topic, keyword});
  document.getElementById("topic").value = "";
  document.getElementById("keyword").value = "";
  loadSubs();
}

async function loadSubs() {
  const r = await api(`/api/users/${currentUser.email}`);
  if (r.code !== 0) return alert(r.msg);
  document.getElementById("dailySendTime").value = r.user.daily_send_time || "09:00";
  const detectedTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Shanghai";
  document.getElementById("timezoneName").value = r.user.timezone_name || detectedTimezone;
  const ul = document.getElementById("subList");
  ul.replaceChildren();
  r.subscriptions.forEach(s => {
    const li = document.createElement("li");
    li.className = "list-group-item d-flex justify-content-between";
    const description = document.createElement("span");
    description.append(document.createTextNode(`${s.topic} `));
    const keyword = document.createElement("small");
    keyword.className = "text-muted";
    keyword.textContent = s.keyword || "";
    description.appendChild(keyword);
    const deleteButton = document.createElement("button");
    deleteButton.className = "btn btn-sm btn-outline-danger";
    deleteButton.textContent = "删除";
    deleteButton.addEventListener("click", () => delSub(s.id));
    li.append(description, deleteButton);
    ul.appendChild(li);
  });
}

async function saveSchedule() {
  if (!currentUser) return alert("请先注册/登录");
  const daily_send_time = document.getElementById("dailySendTime").value;
  const timezone_name = document.getElementById("timezoneName").value.trim();
  const r = await api(`/api/users/${encodeURIComponent(currentUser.email)}/schedule`, "PUT", {daily_send_time, timezone_name});
  const info = document.getElementById("scheduleInfo");
  info.className = r.code === 0 ? "mt-2 text-success" : "mt-2 text-danger";
  info.textContent = r.msg;
}

async function delSub(id) {
  await api(`/api/subscriptions/${id}`, "DELETE");
  loadSubs();
}

async function triggerNow() {
  if (!currentUser) return alert("请先注册/登录");
  const result = document.getElementById("result");
  const loading = document.createElement("div");
  loading.className = "text-info";
  loading.textContent = "Agent 正在工作中，请耐心等待 1-2 分钟...";
  result.replaceChildren(loading);
  const r = await api("/api/trigger", "POST", {user_email: currentUser.email});
  const status = document.createElement("div");
  status.className = r.email_sent ? "text-success" : "text-warning";
  status.textContent = r.msg;
  const output = document.createElement("pre");
  output.className = "bg-light p-3";
  output.textContent = r.output || "";
  result.replaceChildren(status, output);
}

async function loadHistory() {
  if (!currentUser) return alert("请先注册/登录");
  const r = await api(`/api/briefings/${currentUser.email}`);
  const div = document.getElementById("historyList");
  div.replaceChildren();
  r.briefings.forEach(b => {
    const item = document.createElement("div");
    item.className = "border p-2 mb-2";
    const date = document.createElement("b");
    date.textContent = b.date;
    const content = document.createElement("pre");
    content.textContent = `${b.content.slice(0, 500)}...`;
    item.append(date, content);
    div.appendChild(item);
  });
}
</script>
</body>
</html>
